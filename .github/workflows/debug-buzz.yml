name: debug buzz hang v3 (8591a599)
# Same lane-exact replica as v2, with a hardened dump watchdog:
#  - heartbeat every 60s printing any process whose argv mentions
#    buzz_websocket.py (so we see WHAT the watchdog sees)
#  - py-spy dump when such a process ages past 45s, repeat every 60s
#  - set +e inside the watchdog (bash -e hazards cannot kill it)
# Disclosed deviations from conductor-tests.yml: HERMES_TEST_FILE_RETRIES=0,
# no actions/cache restores, py-spy installed for diagnostics.
# Delete this branch after use.
on:
  push:
    branches: [conductor/debug-buzz-8591a599]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  shard8:
    name: Run tests (8) replica
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Host report
        run: |
          nproc; uptime; free -m | head -2; df -h / | tail -1

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: false

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web

      - name: Install py-spy (diagnostic only)
        run: uv pip install py-spy

      - name: Env report
        run: |
          uv --version
          .venv/bin/python -c "import sys, sqlite3, pytest, pytest_asyncio, websockets; print(sys.version); print('sqlite', sqlite3.sqlite_version); print('pytest', pytest.__version__, 'asyncio', pytest_asyncio.__version__, 'websockets', websockets.__version__)"

      - name: Run tests (8/8) with buzz watchdog v3
        run: |
          source .venv/bin/activate
          (
            set +e
            T0=$(date +%s)
            DUMPS=0
            while [ $DUMPS -lt 15 ]; do
              NOW=$(date +%s); AGE=$((NOW - T0))
              SNAP=$(ps -eo pid,etimes,args --no-headers | grep 'buzz_websocket' | grep -v grep)
              if [ -n "$SNAP" ]; then
                echo "=== WD heartbeat ${AGE}s: buzz procs ==="
                echo "$SNAP"
                PID=$(echo "$SNAP" | head -1 | awk '{print $1}')
                ET=$(echo "$SNAP" | head -1 | awk '{print $2}')
                if [ -n "$PID" ] && [ "${ET:-0}" -gt 45 ] 2>/dev/null; then
                  echo "=== WD DUMP #$((DUMPS+1)) pid=$PID age=${ET}s $(date -u +%H:%M:%S) ==="
                  grep -E 'State|Threads|voluntary|nonvoluntary' /proc/$PID/status
                  echo "open fds: $(ls /proc/$PID/fd 2>/dev/null | wc -l)"
                  .venv/bin/py-spy dump --pid $PID 2>&1
                  .venv/bin/py-spy dump --pid $PID --native 2>&1 | head -40
                  DUMPS=$((DUMPS+1))
                fi
              else
                echo "=== WD heartbeat ${AGE}s: no buzz proc ==="
              fi
              sleep 45
            done
            echo "=== WD done ($DUMPS dumps) ==="
          ) &
          WD=$!
          export HERMES_TEST_WORKERS=12
          export HERMES_TEST_FILE_RETRIES=0
          export OPENROUTER_API_KEY=""
          export OPENAI_API_KEY=""
          export NOUS_API_KEY=""
          timeout 2100 scripts/run_tests.sh --slice 8/8 --file-timeout 600
          RC=$?
          kill $WD 2>/dev/null || true
          sleep 2
          kill -9 $WD 2>/dev/null || true
          echo "RUN_TESTS_RC=$RC"
