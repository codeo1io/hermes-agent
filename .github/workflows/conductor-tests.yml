name: Tests

# Conductor-hosted variant of tests.yml, selected by ci.yaml ONLY on
# ephemeral "Conductor CI validation" PRs (head_ref conductor/ci-* + that
# title — the same exemption review-labels.yml uses; see the guards in
# ci.yaml). Real PRs and pushes always take tests.yml itself.
#
# Lane-for-lane copy of tests.yml — same suite, same uv pin with its WAL
# rationale, same fail-loud WAL guard steps, same Node 26 + Ink TUI e2e
# prerequisites, same zero-retry discipline for the race-detector e2e
# suites, same extras — with three differences, all forced by this
# account's hosted-only runner pool (tests.yml's 32-core-pinned lanes
# never leave the queue here):
#   1. The unit lane runs the identical suite as an 8-shard matrix using
#      the runner's own --slice LPT distribution (scripts/run_tests_parallel.py).
#      One 4-vCPU job needs ~70 min for 4819 files — beyond both the job
#      wall and any caller's wait budget; 8 shards finish in ~10 min each
#      with the same 12-worker/3-retry recipe per shard.
#   2. The e2e lane runs on ubuntu-24.04 with a 60m wall via
#      scripts/run_tests.sh --include-integration (same selection as the
#      repo's own e2e lane: all of tests/e2e except core/upgrade), bounded
#      to 4 workers / 900s per-file — calibrated for a dedicated 4-vCPU
#      hosted runner instead of the 32-core machine tests.yml pins.
#   3. The e2e-upgrade lane of tests.yml is not carried: its real N-1 ->
#      HEAD update flows need a full-history checkout and single files run
#      5-15 min, which does not fit the caller's validation window on
#      hosted runners. Disclosed coverage delta: upgrade-path e2e does not
#      run in this lane (it still runs on real fork PRs via tests.yml).
on:
  workflow_call:

permissions:
  contents: read

# Cancel in-progress runs for the same ref
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    # 8 shards spread the 4819-file suite over 4-vCPU hosted runners. The
    # runner's --slice flag distributes files LPT-style (duration-aware when
    # the per-file duration cache is warm, count-balanced when not), so each
    # shard lands ~600 files. With the proven 12-worker/3-retry recipe per
    # shard, a shard completes in ~10 min; the 96-core-era single job needed
    # ~70 min on this runner class and cannot fit any CI wall.
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2", "3", "4", "5", "6", "7", "8"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          # Pin the uv version: unpinned, setup-uv resolves "latest" by
          # fetching a manifest from raw.githubusercontent.com on EVERY job —
          # a transient fetch failure fails the whole job (2026-07-28 slice-5
          # incident). Pinned, the binary downloads directly; no manifest hop.
          #
          # The uv pin also fixes which CPython `uv python install 3.11`
          # resolves, and with it the linked SQLite. uv 0.9.28 resolved
          # 3.11.14 / SQLite 3.50.4, which has the WAL-reset bug, so Hermes
          # ran every state.db in DELETE mode here and the WAL path went
          # untested. 0.12.13 resolves 3.11.16 / SQLite 3.53.1. The
          # "Check SQLite runs WAL" step fails the job if a bump regresses it.
          version: "0.12.13"
          # Persist uv's download/wheel cache (~/.cache/uv) across runs.
          # Keyed on the dependency manifests, so the cache is reused until
          # pyproject.toml or uv.lock changes. `uv sync` still runs every
          # time, but resolves from the warm cache instead of re-downloading
          # and re-building wheels.
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install dependencies
        # `uv sync --locked` installs the exact pinned set from uv.lock (and
        # fails if the lock is out of sync with pyproject.toml), giving a
        # reproducible env. It also creates .venv itself, so no separate
        # `uv venv` step is needed.
        #
        # The trailing extras beyond all/dev are the lazy-install features
        # (tools/lazy_deps.py) that tests exercise for real: provider.anthropic,
        # stt/tts.mistral, image.fal, terminal.modal, terminal.daytona,
        # search.parallel, provider.bedrock. The hermetic test env forbids
        # mid-run pip installs (HERMES_DISABLE_LAZY_INSTALLS=1 in
        # tests/conftest.py), so the SDKs those tests need must be in the
        # venv up front — resolved from uv.lock like everything else, which
        # also honors the exact supply-chain pins these extras carry.
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra parallel-web --extra bedrock

      - name: Minimize uv cache
        # Optimized for CI: prunes pre-built wheels that are cheap to
        # re-download, keeping the persisted cache small and fast to restore.
        run: uv cache prune --ci

      - name: Check SQLite runs WAL
        # Hermes picks DELETE journal mode on a SQLite with the WAL-reset
        # bug. If this interpreter links one, every WAL test silently runs
        # DELETE (or skips), so fail loudly instead. Tests that need DELETE
        # select it explicitly (journal_mode config, a pinned vulnerable
        # version), so they run on any interpreter.
        run: |
          .venv/bin/python -c "import sqlite3, sys, hermes_state_wal as w; v = w.is_sqlite_wal_reset_vulnerable(); print(f'Python {sys.version.split()[0]}, SQLite {sqlite3.sqlite_version}, WAL-reset vulnerable: {v}'); sys.exit(1 if v else 0)"

      - name: Restore per-file duration cache
        # scripts/run_tests_parallel.py raises a file's timeout to
        # 3x its last healthy duration (_effective_file_timeout) so a
        # known-slow file dilated by load is not SIGKILL'd at the flat cap
        # and laundered into a FLAKY retry. The scaler reads
        # test_durations.json from the checkout; without this restore the
        # file is absent on a fresh runner and the scaler is inert.
        # Exact key never matches (run_id differs); restore-keys picks the
        # most recent cache saved by a main push. PRs read, only main writes.
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: test-durations-s${{ matrix.shard }}-never-exact
          restore-keys: |
            test-durations-s${{ matrix.shard }}-

      - name: Run tests
        # Per-file isolation via scripts/run_tests.sh: each test file runs
        # in its own freshly-spawned `python -m pytest <file>` subprocess
        # with bounded parallelism. No xdist, no shared workers, no
        # module-level state leakage between files.
        #
        # No --files: the runner discovers the suite itself. The discovered
        # set is identical to the list the removed matrix job used to pass in.
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh --slice ${{ matrix.shard }}/8 --file-timeout 600
        env:
          # This is the maximum number of test FILES that run together.
          # run_tests_parallel.py starts one pytest subprocess for each file
          # from a single ThreadPoolExecutor, so this value IS the limit.
          #
          # 2026-09-18 retune for the shared 14-core self-hosted runner that
          # this fork now uses (the 96-core EPYC lane is gone). The old
          # 96-worker setting oversubscribed 14 cores ~7x while conductor
          # full-suite runs held load at 85-101: run 35326786703 finished
          # only 95.3% of the suite inside the 60m wall, with 63 files red
          # on first attempt (retry budget exhausted) — all load-contention
          # families, zero related to the PR under test.
          #
          # 12 workers / 3 retries is the recipe already proven green on
          # THIS hardware by the conductor suite-of-record (run #4: 51162
          # passed, 5403s wall, same suite, 12 workers, retries=3,
          # file-timeout 600): near the top of the CPU curve for a busy
          # shared box, and the retry budget absorbs the contention families
          # that a 96-worker oversubscription manufactures.
          HERMES_TEST_WORKERS: 12
          # Absorb load-contention flakes on the shared box: each failed file
          # gets up to 3 retries (default 1). Same proven recipe.
          HERMES_TEST_FILE_RETRIES: 3
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      - name: Save per-file duration cache (main only)
        # Only green first-attempt durations are written by the runner, so
        # a hang on main cannot ratchet its own bound upward.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('test_durations.json') != ''
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: test-durations-s${{ matrix.shard }}-${{ github.run_id }}

  e2e:
    # Post-roll, `tests/e2e` is not just the cross-adapter smoke set: the
    # former `tests/core/*` suites (chaos/liveness, parity, tenancy, history,
    # sqlite torture, compaction, terminal PTY, delivery) live under
    # `tests/e2e/core/*`, and the repo's own e2e lane runs exactly this
    # selection (minus core/upgrade). The runner-based invocation (not bare
    # pytest) keeps per-file subprocess isolation, bounded workers, and the
    # per-file timeout/retry budget. tests.yml pins ubuntu-latest-32-core
    # for this lane; this variant runs the same selection (same Node 26 +
    # Ink TUI build, same HERMES_E2E_REQUIRE_TUI=1, same WAL guard, same
    # zero retries) on a 4-vCPU hosted runner with 4 workers / 900s files.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        # The boot-contract suite feeds serve's stdout through Desktop's own
        # backend-ready.ts (native TS stripping needs Node >= 22.18), and
        # tests/e2e/core/terminal drives the real `hermes --tui` over a PTY.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26

      - name: Install Node deps and build the Ink TUI
        # HERMES_E2E_REQUIRE_TUI=1 below turns a missing build into a
        # failure — the terminal PTY suite must actually run, not skip.
        uses: ./.github/actions/retry
        with:
          command: npm ci --workspace ui-tui --ignore-scripts --no-audit --no-fund && npm run build --workspace ui-tui

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          # Pin the uv version: unpinned, setup-uv resolves "latest" by
          # fetching a manifest from raw.githubusercontent.com on EVERY job —
          # a transient fetch failure fails the whole job (2026-07-28 slice-5
          # incident). Pinned, the binary downloads directly; no manifest hop.
          # Newer than 0.9.28 on purpose: 0.9.28 only knows CPython
          # 3.11.14, whose bundled SQLite has the WAL-reset bug, so Hermes runs
          # state.db in DELETE mode and the WAL torture chamber would skip.
          version: "0.12.13"
          # Persist uv's download/wheel cache (~/.cache/uv) across runs.
          # Keyed on the dependency manifests, so the cache is reused until
          # pyproject.toml or uv.lock changes. `uv sync` still runs every
          # time, but resolves from the warm cache instead of re-downloading
          # and re-building wheels.
          enable-cache: true
          # Own cache entry: a different uv version must not share and
          # overwrite a key it did not write.
          cache-suffix: e2e
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11.15

      - name: Install dependencies
        # `uv sync --locked` installs the exact pinned set from uv.lock (and
        # fails if the lock is out of sync with pyproject.toml), giving a
        # reproducible env. It also creates .venv itself, so no separate
        # `uv venv` step is needed.
        #
        # Same extras as the test job's sync above: the hermetic test env
        # forbids mid-run pip installs (HERMES_DISABLE_LAZY_INSTALLS=1 in
        # tests/conftest.py), so lazy-install SDKs exercised by tests must be
        # in the venv up front.
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11.15 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra parallel-web --extra bedrock

      - name: Minimize uv cache
        # Optimized for CI: prunes pre-built wheels that are cheap to
        # re-download, keeping the persisted cache small and fast to restore.
        run: uv cache prune --ci

      - name: Require a WAL-capable SQLite
        # The state.db suites skip on a WAL-reset-vulnerable SQLite; fail
        # instead of reporting green over zero coverage.
        run: |
          source .venv/bin/activate
          python -c "import sqlite3, hermes_state_wal as w; print('sqlite', sqlite3.sqlite_version); assert not w.is_sqlite_wal_reset_vulnerable()"

      - name: Run e2e tests
        # One subprocess per file, in parallel: the core suites spawn real
        # processes (serve, gateway, tui_gateway, MCP servers, SQLite writers)
        # and must not share interpreter state.
        # tests/e2e/core/upgrade runs only in the repo's own e2e-upgrade
        # lane (not carried here — see the header).
        run: |
          source .venv/bin/activate
          mapfile -t files < <(find tests/e2e -name 'test_*.py' -not -path 'tests/e2e/core/upgrade/*' | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no e2e test files found"
            exit 1
          fi
          scripts/run_tests.sh --include-integration "${files[@]}"
        env:
          HERMES_TEST_WORKERS: "4"
          # Multi-process episodes (torture chamber, compaction kill -9,
          # gateway liveness, delivery exactly-once through a real gateway,
          # the cron virtual-clock soak) legitimately run past the 300 s default.
          HERMES_TEST_FILE_TIMEOUT: "900"
          # No automatic re-run of a failed file: the torture chamber and the
          # exactly-once/compaction suites are race detectors, and a rare
          # corruption that passes on retry is still a corruption.
          HERMES_TEST_FILE_RETRIES: "0"
          # The Ink TUI was built above; a missing build must fail, not skip.
          HERMES_E2E_REQUIRE_TUI: "1"
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
